services:
  - type: web
    name: mystes-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mystes-db
          property: connectionURI
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        value: ""
        # Optional — set in Render dashboard for Redis-backed rate limiting
      - key: GUNICORN_WORKERS
        value: "2"
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: mystes-db
    plan: starter
    databaseName: mystes_db
    user: mystes
