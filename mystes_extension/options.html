<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #333;
    }
    h1 { font-size: 20px; margin-bottom: 24px; }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 24px;
    }
    button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-primary {
      background: #1a73e8;
      color: white;
    }
    .btn-secondary {
      background: #f1f3f4;
      color: #333;
    }
    .status-msg {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .status-msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .status-msg.error { background: #fbe9e7; color: #c62828; display: block; }
  </style>
</head>
<body>
  <h1>Mystes Node Settings</h1>

  <div class="field">
    <label>Server URL</label>
    <input type="text" id="serverUrl" placeholder="https://mystes.example.com">
  </div>

  <div class="field">
    <label>Helper Token</label>
    <input type="text" id="helperToken" placeholder="Your helper authentication token">
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
      <button class="btn-secondary" id="reAuthGoogleBtn" style="font-size:12px;">Re-auth Google</button>
      <button class="btn-secondary" id="reAuthMicrosoftBtn" style="font-size:12px;">Re-auth Microsoft</button>
      <button class="btn-secondary" id="reAuthAppleBtn" style="font-size:12px;">Re-auth Apple</button>
    </div>
    <div class="status-msg" id="reAuthMsg" style="margin-top:6px;"></div>
  </div>

  <div class="field">
    <label>Local Service Port</label>
    <input type="number" id="servicePort" value="19750" min="1024" max="65535">
  </div>

  <div class="actions">
    <button class="btn-primary" id="saveBtn">Save Settings</button>
    <button class="btn-secondary" id="testBtn">Test Connection</button>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <!-- Node Consent & Tier (Build #75) -->
  <hr style="border:none;border-top:1px solid #eee;margin:28px 0 20px;">
  <h2 style="font-size:17px;margin-bottom:4px;">Node Tier</h2>
  <div id="tierInfo" style="margin-bottom:20px;padding:14px;background:#f8f9fa;border-radius:8px;font-size:13px;color:#666;">
    Loading tier info...
  </div>

  <h2 style="font-size:17px;margin-bottom:12px;">Data Consent</h2>
  <p style="font-size:12px;color:#888;margin-bottom:12px;">Choose which data categories you share. More categories = higher tier score.</p>

  <div id="consentToggles" style="display:flex;flex-direction:column;gap:10px;">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:#333;cursor:pointer;">
      <input type="checkbox" id="consent_location" checked disabled>
      <span>Location (required)</span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:#333;cursor:pointer;">
      <input type="checkbox" id="consent_search_queries">
      <span>Search Queries (+5 pts)</span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:#333;cursor:pointer;">
      <input type="checkbox" id="consent_price_observations">
      <span>Price Observations (+6 pts)</span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:#333;cursor:pointer;">
      <input type="checkbox" id="consent_ad_impressions">
      <span>Ad Impressions (+8 pts)</span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:#333;cursor:pointer;">
      <input type="checkbox" id="consent_social_signals">
      <span>Social Signals (+7 pts)</span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:#333;cursor:pointer;">
      <input type="checkbox" id="consent_browsing_data">
      <span>Browsing Data (+4 pts)</span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:#333;cursor:pointer;">
      <input type="checkbox" id="consent_business_data">
      <span>Business Data (+10 pts)</span>
    </label>
  </div>

  <div style="margin-top:16px;">
    <button class="btn-primary" id="saveConsentBtn">Save Consent</button>
  </div>

  <div class="status-msg" id="consentStatusMsg"></div>

  <script src="options.js"></script>
</body>
</html>
