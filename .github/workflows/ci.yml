name: MYSTES CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: mystes-web

jobs:
  # ============================================================
  # Lint & Syntax Check
  # ============================================================
  lint:
    name: Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile server.py
          python -m py_compile models.py
          python -m py_compile config.py
          python -m py_compile monitoring.py
          python -m py_compile seed_db.py
          python -m py_compile payments.py
          python -m py_compile liteapi_client.py
          python -m py_compile picasso_client.py
          python -m py_compile mystes_ai.py
          python -m py_compile booking_fulfillment.py
          python -m py_compile dev_portal_ai.py
          python -m py_compile dev_portal_billing.py
          python -m py_compile routes_push.py
          python -m py_compile validation.py
          python -m py_compile apai_provisioning.py

      - name: Flake8 lint (errors only)
        run: |
          flake8 server.py models.py config.py monitoring.py seed_db.py \
            payments.py liteapi_client.py picasso_client.py \
            --count --select=E9,F63,F7,F82 --show-source --statistics

  # ============================================================
  # Unit & Integration Tests
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        env:
          FLASK_ENV: testing
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "test-secret-key-ci"
        run: |
          pytest tests/test_integration.py -v --tb=short -x

      - name: Run API client tests
        env:
          FLASK_ENV: testing
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "test-secret-key-ci"
        run: |
          pytest tests/test_api_clients.py -v --tb=short -x

  # ============================================================
  # Docker Build
  # ============================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Security Scan
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check --output text || true

      - name: Check for secrets in code
        run: |
          # Basic check for hardcoded secrets
          if grep -rn "password\s*=\s*['\"]" --include="*.py" \
            --exclude="test_*" --exclude="seed_db.py" \
            --exclude="config.py" . | grep -v "password_hash" | grep -v "set_password" | grep -v "check_password" | grep -v "reset_password" | grep -v "# " ; then
            echo "WARNING: Possible hardcoded passwords found"
          fi
