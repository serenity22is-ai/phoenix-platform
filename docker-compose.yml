# PHOENIX Flight Arbitrage Platform - Docker Compose
# Full stack: Web + PostgreSQL + Redis + WebSocket

version: "3.9"

services:
  # Web Application (Flask + Gunicorn)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phoenix-web
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://phoenix:${POSTGRES_PASSWORD:-phoenix_secret}@postgres:5432/phoenix_db
      - REDIS_URL=redis://redis:6379/0
      - RATELIMIT_STORAGE_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
      - app_instance:/app/instance
    networks:
      - phoenix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: phoenix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: phoenix_db
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phoenix_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - phoenix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix -d phoenix_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Redis (Rate Limiting + Caching)
  redis:
    image: redis:7-alpine
    container_name: phoenix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - phoenix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Celery Worker (task execution: payments, P2P, maintenance queues)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phoenix-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--queues=payments,p2p,maintenance", "--concurrency=4"]
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://phoenix:${POSTGRES_PASSWORD:-phoenix_secret}@postgres:5432/phoenix_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    networks:
      - phoenix-network

  # Celery Beat (periodic task scheduler: heartbeats, payouts, alerts, reports)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phoenix-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://phoenix:${POSTGRES_PASSWORD:-phoenix_secret}@postgres:5432/phoenix_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    networks:
      - phoenix-network

  # WebSocket Server (Browser Control Protocol)
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phoenix-websocket
    restart: unless-stopped
    command: ["python", "-m", "browser_control"]
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://phoenix:${POSTGRES_PASSWORD:-phoenix_secret}@postgres:5432/phoenix_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - phoenix-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
  app_instance:
    driver: local

networks:
  phoenix-network:
    driver: bridge
