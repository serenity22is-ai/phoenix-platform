[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anastasia-sdk"
version = "0.3.0"
description = "ANASTASiA — Intelligent booking API with multi-provider credential routing, knowledge cards, and unified search"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.9"
authors = [
    {name = "MYSTES KYRIOS LLC"},
]
keywords = ["anastasia", "picasso", "redbox", "aerticket", "flights", "travel", "booking", "gds", "ota", "ai-agent"]

dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
auth = [
    "playwright>=1.40",
    "pyotp>=2.8",
]
agent = [
    "anthropic>=0.40",
    "flask>=3.0",
]
billing = [
    "stripe>=7.0",
]
db = [
    "flask-sqlalchemy>=3.1",
    "psycopg2-binary>=2.9",
]
all = [
    "anastasia-sdk[auth,agent,billing,db]",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
anastasia = "picasso.agent.assist_cli:main"

[tool.setuptools.packages.find]
include = ["picasso*", "clients*", "anastasia*"]
