<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYSTES — Flights & Hotels</title>
    <meta name="description" content="MYSTES is an online travel agency offering flights and hotels at competitive prices.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0612;
            color: #e2e0e7;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed;
            top: -40%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(ellipse, rgba(124,58,237,0.10) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .logo {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: #fff;
            margin-bottom: 32px;
        }

        .tagline {
            font-size: 1.2rem;
            font-weight: 300;
            color: rgba(255,255,255,0.50);
            margin-bottom: 48px;
            line-height: 1.7;
        }

        .verticals {
            display: flex;
            gap: 32px;
            margin-bottom: 56px;
        }

        .vertical {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 28px 36px;
            backdrop-filter: blur(12px);
        }

        .vertical .icon { font-size: 1.6rem; margin-bottom: 8px; }
        .vertical .label {
            font-weight: 500;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7);
        }

        .contact {
            display: inline-block;
            padding: 12px 32px;
            background: rgba(124,58,237,0.15);
            border: 1px solid rgba(124,58,237,0.3);
            color: #c4b5fd;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .contact:hover {
            background: rgba(124,58,237,0.25);
        }

        footer {
            position: absolute;
            bottom: 32px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.2);
            font-weight: 300;
        }

        @media (max-width: 480px) {
            .logo { font-size: 1.8rem; }
            .verticals { gap: 16px; }
            .vertical { padding: 20px 24px; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="container">
        <div class="logo">MYSTES</div>
        <p class="tagline">Book flights and hotels at the best prices.</p>

        <div class="verticals">
            <div class="vertical">
                <div class="icon">&#9992;&#65039;</div>
                <div class="label">Flights</div>
            </div>
            <div class="vertical">
                <div class="icon">&#127976;</div>
                <div class="label">Hotels</div>
            </div>
        </div>

        <a href="mailto:hello@mystes.app" class="contact">hello@mystes.app</a>
    </div>

    <footer>&copy; 2026 MYSTES KYRIOS LLC</footer>
</body>
</html>
